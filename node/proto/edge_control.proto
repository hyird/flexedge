syntax = "proto3";

package flexedge.node.v2;

message ClientEnvelope {
    string request_id = 1;
    oneof payload {
        Authenticate authenticate = 10;
        Heartbeat heartbeat = 12;
        ObjectRequest object_request = 13;
        ApplyResult apply_result = 14;
        LogDelivery log_delivery = 15;
        ReleaseProbe release_probe = 16;
        NodeReleaseRequest node_release_request = 17;
        CacheResult cache_result = 18;
    }
}

message ServerEnvelope {
    string request_id = 1;
    oneof payload {
        Welcome welcome = 11;
        DesiredState desired_state = 12;
        ObjectBatch object_batch = 13;
        Error error = 14;
        HeartbeatAck heartbeat_ack = 15;
        LogDeliveryAck log_delivery_ack = 16;
        ReleaseProbeAck release_probe_ack = 17;
        NodeReleaseChunk node_release_chunk = 18;
        ApplyResultAck apply_result_ack = 19;
        CacheResultAck cache_result_ack = 20;
    }
}

message Authenticate {
    uint32 response_cache_protocol = 13;
    string node_id = 1;
    string secret = 2;
    int64 applied_node_spec_revision = 5;
    string active_release_id = 6;
    string active_manifest_digest = 7;
    string agent_version = 8;
    AgentSessionPurpose session_purpose = 10;
    bool require_apply_ack = 11;
    bool multiplex_logs = 12;
    reserved 9;
}

enum AgentSessionPurpose {
    AGENT_SESSION_PURPOSE_UNSPECIFIED = 0;
    AGENT_SESSION_PURPOSE_CONTROL = 1;
    AGENT_SESSION_PURPOSE_LOG_INGEST = 2;
}

message Welcome {
    string node_id = 1;
    int64 desired_node_spec_revision = 2;
    string desired_release_id = 3;
    string desired_manifest_digest = 4;
    uint32 heartbeat_interval_seconds = 5;
    string node_binary_sha256 = 6;
    bool multiplex_logs = 7;
}

message Heartbeat {
    string node_id = 1;
    int64 applied_node_spec_revision = 2;
    string active_release_id = 3;
    string active_manifest_digest = 4;
    string agent_version = 5;
    double cpu_usage = 6;
    double memory_usage = 7;
    int64 traffic_out_bps = 8;
    int64 connection_count = 9;
    double load_1m = 10;
    string health = 11;
    string last_error = 12;
    uint64 queued_log_events = 13;
    uint64 dropped_log_events = 14;
    repeated OriginHealth origin_health = 15;
    // Distinct client IP addresses with an open data-plane connection. Absent when the node
    // could not count them and from nodes before 0.4.1, so readers can tell it apart from 0.
    optional int64 connected_ip_count = 16;
    // Host capacity; absent on older nodes or when a measurement is unavailable.
    // CPU count is logical processors; disk is the node working-directory filesystem.
    optional uint32 cpu_count = 17;
    optional uint64 memory_total_bytes = 18;
    optional uint64 disk_total_bytes = 19;
    // Used / total capacity on the same filesystem. Absent when unavailable.
    optional double disk_usage = 20;
    // Current node-wide cache occupancy, including cache metadata. Absent on older nodes.
    optional uint64 cache_memory_bytes = 21;
    optional uint64 cache_disk_bytes = 22;
}

message OriginHealth {
    string website_id = 1;
    string origin_id = 2;
    string status = 3;
    int64 checked_at_unix_millis = 4;
    uint32 latency_millis = 5;
    string last_error = 6;
}

message HeartbeatAck {
    repeated CacheCommand cache_commands = 6;
    int64 desired_node_spec_revision = 1;
    string desired_release_id = 2;
    string desired_manifest_digest = 3;
    uint32 next_interval_seconds = 4;
    string node_binary_sha256 = 5;
}

message ReleaseProbe {
    uint32 wait_seconds = 1;
    int64 applied_node_spec_revision = 2;
    string active_release_id = 3;
    string active_manifest_digest = 4;
}

message ReleaseProbeAck {
    string node_binary_sha256 = 1;
    int64 desired_node_spec_revision = 2;
    string desired_release_id = 3;
    string desired_manifest_digest = 4;
}

// Nodes pull a verified release in bounded chunks over their authenticated control
// WebSocket.  A request/response exchange supplies backpressure: a node asks for
// the next offset only after it has written the preceding chunk to the candidate.
message NodeReleaseRequest {
    string node_id = 1;
    string digest_sha256 = 2;
    uint64 offset = 3;
}

message NodeReleaseChunk {
    string version = 1;
    string digest_sha256 = 2;
    uint64 total_bytes = 3;
    uint64 offset = 4;
    bytes data = 5;
}

enum ApplyPhase {
    APPLY_PHASE_UNSPECIFIED = 0;
    APPLY_PHASE_STAGE = 1;
    APPLY_PHASE_VALIDATE = 2;
    APPLY_PHASE_ACTIVATE = 3;
}

message ApplyResult {
    string node_id = 1;
    int64 node_spec_revision = 2;
    string release_id = 3;
    string manifest_digest = 4;
    bool applied = 5;
    ApplyPhase failed_phase = 6;
    string error_code = 7;
    string error = 8;
    bool retryable = 9;
    // Local steps in the order the node ran them; steps after a failed one are absent.
    // At most 16 steps and 100 log lines, every string at most 512 bytes. Neither carries
    // secrets, key or certificate material, object payloads, credentials, digests or
    // revision numbers. Absent from nodes before 0.4.1.
    repeated ApplyStep steps = 10;
    repeated ApplyLog logs = 11;
}

// One local apply step. phase is one of:
//   load_objects       read the release objects the node already holds from its local cache
//   fetch_objects      request the missing objects from the control plane (only when some are missing)
//   stage              write the desired state and objects to the staging directory
//   validate           compile the configuration (ApplyPhase VALIDATE)
//   prepare_listeners  check the release follows the active one, build TLS contexts and bind
//                      new listeners (ApplyPhase VALIDATE)
//   activate           start listeners, persist the staged state as active and switch traffic
// Steps before stage run before ApplyResult exists; a failure there ends the session
// without a result, so they are only reported as ok.
message ApplyStep {
    string phase = 1;
    int64 started_unix_ms = 2;  // Wall clock.
    int64 duration_ms = 3;      // Monotonic clock.
    bool ok = 4;
    string error = 5;           // Empty when ok; otherwise the error text of ApplyResult.error.
}

// A log line the node emitted while applying this release.
message ApplyLog {
    string level = 1;  // info, warning or error.
    int64 unix_ms = 2;
    string message = 3;
    // ApplyStep.phase of the step the line belongs to: the step running when it was written,
    // else the step that finished last (a step's summary line is written after it ends).
    // Empty before the first step. The controller attaches the line to the most recent step
    // with this phase, and attaches lines without one by unix_ms.
    string phase = 4;
}

message LogDelivery {
    string node_id = 1;
    repeated LogEvent events = 2;
}

message LogDeliveryAck {}

message LogEvent {
    oneof entry {
        AccessLog access_log = 1;
        NodeLog node_log = 2;
    }
}

message AccessLog {
    string id = 1;
    uint64 occurred_unix_ms = 2;
    string website_id = 3;
    string client_ip = 4;
    string protocol = 5;
    string method = 6;
    string host = 7;
    string target = 8;
    uint32 status_code = 9;
    uint64 response_bytes = 10;
    uint64 duration_ms = 11;
    string user_agent = 12;
    string referer = 13;
    string request_headers = 14;
    string request_body = 15;
    bool request_body_truncated = 16;
    string tls_fingerprint = 17;
    string response_headers = 18;
    string query_string = 19;
    string cookies = 20;
    uint64 request_bytes = 21;
    string cache_status = 22; // hit_memory, hit_disk, miss, bypass; empty on older nodes
    string cache_reason = 23; // Cache decision reason code; empty on older nodes
    bool cache_revalidated = 24; // Origin validated an existing cached representation
    string request_type = 25; // http, sse, websocket; empty on older nodes
    uint64 started_unix_ms = 26;
    optional uint64 first_byte_ms = 27;
    string end_reason = 28;
    // Full connection counters. Legacy fields retain their previous bounds so
    // rolling node upgrades remain accepted by older control planes.
    optional uint64 total_duration_ms = 29;
    optional uint64 total_request_bytes = 30;
    optional uint64 total_response_bytes = 31;
}

message NodeLog {
    string id = 1;
    uint64 occurred_unix_ms = 2;
    string level = 3;
    string category = 4;
    string message = 5;
}

message DesiredState {
    NodeSpec node_spec = 1;
    ClusterReleaseManifest release = 2;
}

// NodeSpec, ClusterReleaseManifest and DeliveryObject are content-addressed: content holds the
// serialized *Content message (the same wire format as the former embedded message field) and
// digest_sha256 is the SHA-256 of exactly those bytes. Readers hash the bytes they received and
// parse them only after the digest matches, so fields they do not know never fail verification.
message NodeSpec {
    string digest_sha256 = 1;
    bytes content = 2;  // NodeSpecContent
}

message NodeSpecContent {
    string node_id = 1;
    uint32 schema_version = 2;
    int64 revision = 3;
    string name = 4;
    bool enabled = 5;
    repeated Endpoint endpoints = 6;
    reserved 7;
    reserved "cache";
}

message ClusterReleaseManifest {
    string digest_sha256 = 1;
    bytes content = 2;  // ClusterReleaseContent
}

message ClusterReleaseContent {
    string cluster_id = 1;
    string release_id = 2;
    int64 generation = 3;
    string access_domain = 4;
    bool enabled = 5;
    repeated ObjectRef objects = 6;
    uint32 schema_version = 7;
}

enum ObjectKind {
    OBJECT_KIND_UNSPECIFIED = 0;
    OBJECT_KIND_WEBSITE = 1;
    OBJECT_KIND_CERTIFICATE = 2;
}

message ObjectRef {
    ObjectKind kind = 1;
    string digest_sha256 = 2;
}

message ObjectRequest {
    string node_id = 1;
    string release_id = 2;
    repeated string digest_sha256 = 3;
}

message ObjectBatch {
    string release_id = 1;
    repeated DeliveryObject objects = 2;
}

message DeliveryObject {
    string digest_sha256 = 1;
    bytes content = 2;  // DeliveryObjectContent
}

message DeliveryObjectContent {
    oneof payload {
        Website website = 10;
        Certificate certificate = 11;
    }
}

message Endpoint {
    string id = 1;
    string ip_address = 2;
    string line_code = 3;
    string line_name = 4;
    uint32 http_port = 5;
    uint32 https_port = 6;
}

message Website {
    string id = 1;
    bool enabled = 2;
    int64 revision = 3;
    repeated Domain domains = 4;
    repeated Origin origins = 5;
    string origin_host_header = 6;
    uint32 origin_connect_timeout_seconds = 7;
    uint32 origin_read_timeout_seconds = 8;
    bool pass_client_ip = 9;
    bool health_check_enabled = 10;
    bool https_enabled = 11;
    string minimum_tls_version = 12;
    bool force_https = 13;
    // Retired: never set and ignored. Nodes released before raw-byte digests verify objects
    // by re-serializing them, and objects published while this field was live still carry it.
    // Keeping it known lets those nodes reproduce the published bytes; as an unknown field it
    // would be re-emitted after all known fields and fail their verification.
    bool http2_enabled = 14 [deprecated = true];
    bool hsts_enabled = 15;
    string health_check_path = 16;
    uint32 health_check_interval_seconds = 17;
    uint32 health_check_timeout_seconds = 18;
    uint32 healthy_threshold = 19;
    uint32 unhealthy_threshold = 20;
    bool response_compression_enabled = 21;
    uint32 response_compression_min_bytes = 22;
    repeated string response_compression_algorithms = 23;
    repeated string response_compression_mime_types = 24;
    repeated string response_compression_extensions = 25;
    repeated string response_compression_excluded_extensions = 26;
    uint32 response_compression_max_bytes = 27;
    bool access_log_request_headers = 28;
    bool access_log_request_body = 29;
    bool access_log_enabled = 30;
    bool access_log_response_headers = 31;
    bool access_log_query_params = 32;
    bool access_log_cookies = 33;
    bool access_log_referer = 34;
    bool access_log_user_agent = 35;
    repeated string access_log_status_code_ranges = 36;
    bool access_log_client_abort = 37;
    repeated RouteRule route_rules = 38;
    uint32 health_check_expected_status = 39;
    string default_origin_group = 40;
    reserved 41, 42;
    reserved "cache_enabled", "cache_policy";
    CachePolicy response_cache = 43;
    string origin_http_version = 44; // auto, http1, http2; empty means auto
}

// Added fields are ignored by older nodes. The control plane only dispatches cache
// commands to nodes advertising response_cache_protocol=1 during authentication.
message CachePolicy {
    string id = 1;
    int64 revision = 2;
    bool enabled = 3;
    string storage = 4;
    int64 memory_bytes = 5;
    int64 disk_bytes = 6;
    int64 max_object_bytes = 7;
    string directory = 8;
    repeated CacheRule rules = 9;
    int64 memory_percent = 10; // zero selects the fixed byte capacity
    int64 disk_percent = 11;
    int64 memory_reserved_bytes = 12;
    int64 disk_reserved_bytes = 13;
}

message CacheRule {
    string id = 1;
    string name = 2;
    bool enabled = 3;
    string match_type = 4;
    repeated string patterns = 5;
    string action = 6;
    string ttl_mode = 7;
    int64 ttl_seconds = 8;
    bool ignore_query = 9;
    repeated string methods = 10;
    repeated uint32 status_codes = 11;
    int64 min_object_bytes = 12;
    int64 max_object_bytes = 13;
    bool skip_set_cookie = 14;
    int64 browser_ttl_seconds = 15;
    optional bool skip_no_cache = 16;
    optional bool respect_request_no_cache = 17;
}

message CacheCommand {
    string task_id = 1;
    int64 generation = 2;
    string attempt_id = 3;
    string operation = 4; // prewarm, refresh, clean
    string policy_id = 5;
    repeated string website_ids = 6;
    string scope = 7; // urls, prefix, all, expired
    repeated string urls = 8;
    int64 expires_unix_ms = 9;
}

message CacheResult {
    string node_id = 1;
    string task_id = 2;
    int64 generation = 3;
    string attempt_id = 4;
    bool ok = 5;
    string error = 6;
    uint64 affected_objects = 7;
    uint64 affected_bytes = 8;
    uint32 completed_urls = 9;
    repeated string failures = 10;
}

message CacheResultAck { string attempt_id = 1; }

message RouteRule {
    string id = 1;
    bool enabled = 2;
    string match_type = 3;
    string path = 4;
    repeated string methods = 5;
    string action = 6;
    string rewrite_path = 7;
    string redirect_url = 8;
    uint32 redirect_status = 9;
    repeated HeaderMutation request_headers = 10;
    repeated HeaderMutation response_headers = 11;
    repeated string origin_ids = 12;
    string origin_group = 13;
    string name = 14;
    string description = 15;
    repeated string hostnames = 16;
    string rewrite_mode = 17;
    string query_mode = 18;
    string query_string = 19;
    repeated RouteCondition conditions = 20;
}

message RouteCondition {
    string source = 1;
    string name = 2;
    string op = 3;
    string value = 4;
}

message HeaderMutation {
    string name = 1;
    string value = 2;
}

message Domain {
    string hostname = 1;
    bool https_enabled = 2;
    string certificate_digest = 3;
}

message Origin {
    string id = 1;
    string protocol = 2;
    string host = 3;
    uint32 port = 4;
    string role = 5;
    uint32 weight = 6;
    bool enabled = 7;
    string group = 8;
}

message Certificate {
    string id = 1;
    string certificate_chain_pem = 2;
    string private_key_pem = 3;
}

message Error {
    uint32 code = 1;
    string message = 2;
    bool retryable = 3;
}

message ActiveState {
    NodeSpec node_spec = 1;
    ClusterReleaseManifest release = 2;
}

// Confirms that the matching result was committed by the controller.
message ApplyResultAck {
    string node_id = 1;
    int64 node_spec_revision = 2;
    string release_id = 3;
    string manifest_digest = 4;
    bool applied = 5;
}
