<!doctype html>
<html lang="zh-CN" dir="ltr" class="light" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Apply the saved theme before styles paint; React owns subsequent changes.
      // Keep the storage key and default aligned with ThemeProvider.
      ;(() => {
        let theme = 'light'
        try {
          const saved = localStorage.getItem('flexedge-theme')
          if (saved === 'light' || saved === 'dark' || saved === 'system') {
            theme = saved
          }
        } catch {
          // Storage is optional; use the same light default as ThemeProvider.
        }
        let dark = theme === 'dark'
        if (theme === 'system') {
          try {
            dark = window.matchMedia('(prefers-color-scheme: dark)').matches
          } catch {
            // Keep the document usable if media queries are unavailable.
          }
        }
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.classList.toggle('light', !dark)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      })()
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="FlexEdge 边缘网站、DNS、证书与节点管理控制台"
    />
    <meta name="theme-color" content="#ffffff" />
    <!-- Inline icon: the single-file build serves no other static assets. -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230485f7'/%3E%3Cg fill='none' stroke='white' stroke-width='2'%3E%3Ccircle cx='16' cy='16' r='9'/%3E%3Cpath d='M7 16h18M16 7c-3 3-3 15 0 18M16 7c3 3 3 15 0 18'/%3E%3C/g%3E%3C/svg%3E"
    />
    <title>FlexEdge Console</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
